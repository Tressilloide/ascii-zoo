[package]
name = "ascii-dreams"
version = "0.4.0"
publish = false
edition = "2021"
description = "The ASCII Zoo screensaver: starfield, rain, campfire, aurora, life, night sea"
license = "MIT"

[dependencies]
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
