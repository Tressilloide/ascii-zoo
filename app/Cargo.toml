[package]
name = "ascii-zoo"
version = "0.1.0"
edition = "2021"
description = "Sfondo animato ASCII Zoo per Windows (KARPISA inclusa)"

[dependencies]
wry = "0.53"
tray-icon = "0.21"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
