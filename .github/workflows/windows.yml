# Programma per Windows: compilato a ogni push e pull request.
# Con un tag "v*" (es. v0.1.0) l'exe compilato qui viene pubblicato nelle Releases,
# con il suo SHA256 e l'attestazione di provenienza di GitHub.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Lo sfondo incorporato è uguale a sfondo/index.html
        run: cmp sfondo/index.html app/assets/ascii-zoo-sfondo.html

      - name: Il tag corrisponde alla versione in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, ma app/Cargo.toml dice $version"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Compila
        working-directory: app
        run: cargo build --release --locked

      - name: SHA256
        run: |
          mkdir dist
          cp app/target/release/ascii-zoo.exe dist/
          cd dist
          sha256sum ascii-zoo.exe | tee ascii-zoo.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ascii-zoo-windows
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creare la Release
      id-token: write      # attestazione di provenienza
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascii-zoo-windows
          path: dist

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ascii-zoo.exe

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(cut -d' ' -f1 dist/ascii-zoo.exe.sha256)
          cat > notes.md <<EOF
          ## Scarica

          **\`ascii-zoo.exe\`**: programma per Windows 10/11 (64 bit). Non si installa: copialo in una cartella fissa (es. \`%LOCALAPPDATA%\\AsciiZoo\`) e avvialo.

          Compilato da GitHub Actions dal sorgente di questo tag: [log della build](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          **SHA256:** \`$sha\`

          ## Verificarlo

          \`\`\`powershell
          Get-FileHash .\ascii-zoo.exe -Algorithm SHA256
          gh attestation verify .\ascii-zoo.exe --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ## "Windows ha protetto il PC"

          L'exe non è firmato, quindi al primo avvio SmartScreen lo blocca: **Ulteriori informazioni → Esegui comunque**.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/ascii-zoo.exe dist/ascii-zoo.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "ASCII Zoo $GITHUB_REF_NAME" --notes-file notes.md
