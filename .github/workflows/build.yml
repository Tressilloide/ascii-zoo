# Compila il programma per Windows e per macOS a ogni push e pull request
# (exe e DMG si scaricano dagli artifact della run) e prova l'installazione su Linux.
# Con un tag "v*" (es. v0.2.0) pubblica nelle Releases quello che è stato compilato
# qui, con gli SHA256 e l'attestazione di provenienza di GitHub.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Lo sfondo incorporato è uguale a sfondo/index.html
        run: cmp sfondo/index.html app/assets/ascii-zoo-sfondo.html

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Compila
        working-directory: app
        run: cargo build --release --locked

      - name: SHA256
        run: |
          mkdir dist
          cp app/target/release/ascii-zoo.exe dist/
          cd dist
          sha256sum ascii-zoo.exe | tee ascii-zoo.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ascii-zoo-windows
          path: dist/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Target Apple Silicon e Intel
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Compila
        working-directory: app
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: App universale e DMG
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          app="build/ASCII Zoo.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/ascii-zoo" \
            app/target/aarch64-apple-darwin/release/ascii-zoo \
            app/target/x86_64-apple-darwin/release/ascii-zoo
          sed "s/@VERSION@/$version/g" app/macos/Info.plist > "$app/Contents/Info.plist"
          # firma "ad hoc": non è un certificato Apple, ma i Mac con Apple Silicon
          # non avviano codice senza nessuna firma
          codesign --force --deep --sign - "$app"
          mkdir build/dmg
          cp -R "$app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "ASCII Zoo" -srcfolder build/dmg -ov -format UDZO dist/ascii-zoo-macos.dmg
          cd dist
          shasum -a 256 ascii-zoo-macos.dmg | tee ascii-zoo-macos.dmg.sha256

      - name: Prova - avvia l'app e fotografa lo schermo
        run: |
          "build/ASCII Zoo.app/Contents/MacOS/ascii-zoo" &
          pid=$!
          sleep 20
          screencapture -x prova-macos.png || echo "::warning::screenshot non riuscito"
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::l'app si è chiusa da sola"
            exit 1
          fi
          kill "$pid"

      - uses: actions/upload-artifact@v4
        with:
          name: ascii-zoo-macos
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: prova-macos
          path: prova-macos.png
          if-no-files-found: warn

  # Su Linux si installa compilando dal sorgente con linux/install.sh: qui lo si
  # esegue per intero (pacchetti, compilazione, file nella cartella dell'utente) e
  # poi si avvia il programma su uno schermo virtuale, come prova.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lo sfondo incorporato è uguale a sfondo/index.html
        run: cmp sfondo/index.html app/assets/ascii-zoo-sfondo.html

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Installa con linux/install.sh
        env:
          ASCII_ZOO_NON_AVVIARE: "1"
        run: bash linux/install.sh

      - name: File installati
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          test -x ~/.local/bin/ascii-zoo
          test -f ~/.local/share/icons/hicolor/scalable/apps/ascii-zoo.svg
          desktop-file-validate ~/.local/share/applications/ascii-zoo.desktop
          desktop-file-validate ~/.config/autostart/ascii-zoo.desktop
          cat ~/.config/autostart/ascii-zoo.desktop

      - name: Prova - avvia l'app sotto Xvfb, con una finestra sopra, e fotografa lo schermo
        run: |
          sudo apt-get install -y -qq xvfb openbox xterm imagemagick dbus-x11 libglib2.0-bin
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          openbox &
          sleep 1
          cat > prova.sh <<'FINE'
          ~/.local/bin/ascii-zoo > app.log 2>&1 &
          pid=$!
          sleep 20
          # una finestra normale: deve restare sopra lo sfondo
          xterm -geometry 70x12+80+80 -e "echo finestra normale sopra lo sfondo; sleep 60" &
          sleep 4
          import -window root prova-linux.png || echo "::warning::screenshot non riuscito"
          # l'icona nella barra: il programma deve esporre uno StatusNotifierItem su D-Bus
          trovata=no
          nomi=$(gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus \
                   --method org.freedesktop.DBus.ListNames | grep -oE ':[0-9]+\.[0-9]+')
          for n in $nomi; do
            if gdbus introspect --session --dest "$n" --object-path / --recurse 2>/dev/null | grep -q org.kde.StatusNotifierItem; then
              trovata=si
            fi
          done
          echo "icona nella barra registrata su D-Bus: $trovata"
          [ "$trovata" = si ] || echo "::warning::nessuno StatusNotifierItem trovato"
          echo "--- log dell'app ---"; cat app.log
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::l'app si è chiusa da sola"
            exit 1
          fi
          kill "$pid"
          FINE
          dbus-run-session -- bash prova.sh

      - uses: actions/upload-artifact@v4
        with:
          name: prova-linux
          path: prova-linux.png
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creare la Release
      id-token: write      # attestazione di provenienza
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Il tag corrisponde alla versione in Cargo.toml
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, ma app/Cargo.toml dice $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ascii-zoo-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ascii-zoo-macos
          path: dist

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ascii-zoo.exe
            dist/ascii-zoo-macos.dmg

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha_exe=$(cut -d' ' -f1 dist/ascii-zoo.exe.sha256)
          sha_dmg=$(cut -d' ' -f1 dist/ascii-zoo-macos.dmg.sha256)
          cat > notes.md <<EOF
          ## Scarica

          | Sistema | File | SHA256 |
          |---|---|---|
          | Windows 10/11 (64 bit) | \`ascii-zoo.exe\` | \`$sha_exe\` |
          | macOS 11 o successivo (Apple Silicon e Intel) | \`ascii-zoo-macos.dmg\` | \`$sha_dmg\` |

          Compilati da GitHub Actions dal sorgente di questo tag: [log della build](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ### Windows
          Non si installa: copia \`ascii-zoo.exe\` in una cartella fissa (es. \`%LOCALAPPDATA%\\AsciiZoo\`) e avvialo.
          L'exe non è firmato, quindi al primo avvio SmartScreen lo blocca: **Ulteriori informazioni → Esegui comunque**.

          ### macOS
          Apri il DMG e trascina **ASCII Zoo** in **Applicazioni**. L'app non è firmata con un certificato Apple, quindi al primo avvio macOS la blocca:
          apri **Impostazioni di Sistema → Privacy e sicurezza** e premi **Apri comunque** (poi conferma). L'icona compare nella barra dei menu.

          ## Verificarli

          \`\`\`
          gh attestation verify <file> --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" \
            dist/ascii-zoo.exe dist/ascii-zoo.exe.sha256 \
            dist/ascii-zoo-macos.dmg dist/ascii-zoo-macos.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "ASCII Zoo $GITHUB_REF_NAME" --notes-file notes.md
